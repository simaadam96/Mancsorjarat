<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mancs Ment&#337;akci&#243;">
  <meta name="theme-color" content="#29B6F6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <title>Mancs Ment&#337;akci&#243;</title>
  <style id="inline-styles">
/* Mancs Mentőakció – 1. fázis stíluslap. Logikai színpad: 1366×1024. */
:root { --letterbox: #29B6F6; --ink: #3B2A20; --gold: #FFC107; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }

html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0;
  background: var(--letterbox);
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  touch-action: none; overscroll-behavior: none;
  font-family: "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color: var(--ink);
}
img, svg { -webkit-user-drag: none; user-drag: none; }
button { font: inherit; color: inherit; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; outline: none; }

#viewport { position: fixed; inset: 0; width: 100dvw; height: 100dvh; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1366px; height: 1024px;
  transform-origin: center center; overflow: hidden; background: #fff;
  transform: translate(-50%, -50%);
}
#screen-host, .screen { position: absolute; inset: 0; }
.screen > * { position: absolute; }
body.input-locked .screen { cursor: wait; }

/* ---------- Közös ---------- */
.is-hidden { display: none !important; }
.is-disabled { pointer-events: none; }
.is-pressed { animation: press 0.22s ease-out; }
@keyframes press { 50% { transform: scale(0.93); } }

[class*="anim-"] { transform-box: fill-box; transform-origin: center; }
.anim-flicker { animation: flicker 0.5s ease-in-out infinite alternate; transform-origin: bottom center; }
.anim-bob { animation: bob 1.6s ease-in-out infinite; }
.anim-wiggle { animation: wiggle 0.7s ease-in-out infinite; }
.anim-rustle { animation: wiggle 0.5s ease-in-out infinite; }
.anim-rise { animation: rise 2.4s ease-out infinite; }
.anim-chug { animation: bob 0.45s ease-in-out infinite; }
.anim-float { animation: rise 2.2s ease-out infinite; }
.anim-drift { animation: drift 14s ease-in-out infinite alternate; }
.anim-spin-slow { animation: spin 18s linear infinite; }
.anim-twinkle { animation: twinkle 1.1s ease-in-out infinite; }
.anim-fall { animation: fall 1.1s ease-in infinite; }
.anim-wobble { animation: wiggle 1.2s ease-in-out infinite; }
.anim-train-go { animation: drift 3s ease-in-out infinite alternate; }
.anim-hop { animation: hop 0.7s ease-in-out infinite; }
.anim-peek { animation: bob 1s ease-in-out infinite; }
.anim-wave { animation: drift 3s ease-in-out infinite alternate; }
@keyframes flicker { from { transform: scale(1, 0.94); } to { transform: scale(1.06, 1.06); } }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes wiggle { 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
@keyframes rise { 0% { transform: translateY(14px); opacity: 0.9; } 100% { transform: translateY(-22px); opacity: 0; } }
@keyframes drift { to { transform: translateX(16px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 50% { transform: scale(0.55) rotate(25deg); opacity: 0.6; } }
@keyframes fall { 0% { transform: translateY(-12px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(40px); opacity: 0; } }
@keyframes hop { 50% { transform: translateY(-16px); } }

.pup, .pup-svg { display: block; }
.pup-tail { animation: wag 0.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 100%; }
.pup-eyes { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes wag { to { transform: rotate(16deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.hud-left { position: absolute; left: 28px; top: 24px; display: flex; align-items: center; gap: 16px; }
.hud-home-btn {
  width: 112px; height: 112px; border-radius: 32px;
  background: linear-gradient(180deg, #FFCA28, #FB8C00);
  border: 6px solid var(--ink); pointer-events: auto;
  box-shadow: 0 8px 0 #E65100, inset 0 4px 0 rgba(255,255,255,.55);
  display: grid; place-items: center;
}
.hud-home-btn .home-icon { width: 72px; height: 72px; }
.hud-bones { display: flex; gap: 6px; padding: 8px 16px; border-radius: 36px; background: rgba(255,255,255,.45); backdrop-filter: blur(6px); border: 4px solid rgba(59,42,32,.25); }
.bone-slot { width: 124px; height: 62px; }
.bone-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
.bone-outline circle, .bone-outline rect { fill: var(--ink); stroke: var(--ink); stroke-width: 7; stroke-linejoin: round; }
.bone-shape circle, .bone-shape rect { fill: #CFD8DC; transition: fill 0.5s; }
.bone-shine { opacity: 0; }
.bone-slot.is-filled .bone-shape circle, .bone-slot.is-filled .bone-shape rect { fill: var(--gold); }
.bone-slot.is-filled .bone-shine { opacity: 0.8; }
.bone-slot.is-just-earned { animation: bone-pop 0.9s cubic-bezier(.3,1.6,.5,1); }
@keyframes bone-pop { 0% { transform: scale(1); } 40% { transform: scale(1.5) rotate(-8deg); } 100% { transform: scale(1); } }

.hud-speaker-btn {
  position: absolute; right: 30px; top: 30px; width: 120px; height: 120px; border-radius: 50%;
  background: #1E88E5; border: 6px solid var(--ink); pointer-events: auto;
  box-shadow: 0 8px 0 #0D47A1; display: grid; place-items: center;
}
.speaker-icon { width: 78px; height: 78px; }
.speaker-icon .wave { opacity: 0.4; }
body.is-speaking .speaker-icon .wave { animation: wavepulse 0.6s infinite alternate; }
body.is-speaking .speaker-icon .wave-2 { animation-delay: 0.3s; }
@keyframes wavepulse { to { opacity: 1; } }

#caption {
  position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  max-width: 1000px; padding: 14px 34px; border-radius: 44px; background: rgba(255,255,255,.94);
  border: 5px solid var(--ink); font-size: 36px; font-weight: 800; text-align: center; line-height: 1.2;
  opacity: 0; pointer-events: none; z-index: 60; transition: opacity .3s, transform .3s;
}
#caption.is-visible { opacity: 1; transform: translateX(-50%); }

/* ---------- Splash ---------- */
.splash-bg, .hub-bg { inset: 0; }
.hub-landscape { width: 100%; height: 100%; display: block; }
.splash-content { inset: 0; }
.splash-banner { left: 0; right: 0; top: 40px; text-align: center; }
.splash-title { margin: 0; font-size: 92px; color: #fff; text-shadow: 0 6px 0 var(--ink), 0 0 0 var(--ink); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.splash-pups { display: flex; justify-content: center; gap: 40px; margin-top: 10px; }
.splash-pup-svg { width: 150px; height: 174px; animation: hop 0.9s ease-in-out infinite; }
.splash-pup:nth-child(2) .splash-pup-svg { animation-delay: .2s; }
.splash-pup:nth-child(3) .splash-pup-svg { animation-delay: .4s; }
.splash-reach { left: 0; right: 0; top: 540px; height: 440px; display: grid; place-items: center; }
.splash-start-btn { position: relative; width: 340px; height: 340px; animation: pulse 1.3s ease-in-out infinite; }
.splash-start-btn__halo { position: absolute; inset: -20px; border-radius: 50%; background: radial-gradient(#FFF59D, transparent 70%); }
.splash-start-btn__badge { position: absolute; inset: 0; }
.splash-start-btn .paw-badge-svg { width: 100%; height: 100%; }
.splash-start-btn__play { position: absolute; right: 8px; bottom: 6px; width: 110px; height: 110px; border-radius: 50%; background: #43A047; border: 6px solid var(--ink); color: #fff; font-size: 56px; display: grid; place-items: center; }
@keyframes pulse { 50% { transform: scale(1.09); } }

/* ---------- HUB ---------- */
.hub-sun-rays { animation: spin 30s linear infinite; transform-box: fill-box; transform-origin: center; }
.hub-cloud { animation: drift 10s ease-in-out infinite alternate; }
.hub-tower-wrap { left: 478px; top: 24px; width: 410px; height: 620px; }
.tower { width: 100%; height: 100%; overflow: visible; }
.tower-radar { animation: spin 3s linear infinite; transform-box: fill-box; transform-origin: center; }
.tower-beacon { animation: twinkle 1s infinite; transform-box: fill-box; transform-origin: center; }
.hub-reach-zone { inset: 0; }
.hub-side-group--left {
  position: absolute; left: 84px; top: 736px; display: flex; gap: 36px; align-items: center;
}
.hub-mode-btn {
  position: relative; width: 168px; height: 168px; border-radius: 40px;
  border: 7px solid var(--ink); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  transition: transform .18s;
}
.hub-mode-btn--care {
  background: linear-gradient(180deg, #81D4FA, #039BE5);
  box-shadow: 0 10px 0 #01579B, inset 0 5px 0 rgba(255,255,255,.55);
}
.hub-mode-btn--sorter {
  background: linear-gradient(180deg, #FFE082, #FFB300);
  box-shadow: 0 10px 0 #E65100, inset 0 5px 0 rgba(255,255,255,.65);
}
.hub-mode-btn svg { width: 104px; height: 104px; filter: drop-shadow(0 4px 3px rgba(0,0,0,.2)); }
.hub-mode-btn__label, .hub-album-btn__label {
  font-size: 24px; font-weight: 900; color: #fff;
  text-shadow: 0 3px 0 var(--ink); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill;
}
.hub-paw-btn {
  position: absolute; left: 573px; top: 690px; width: 220px; height: 220px;
  animation: pulse 1.4s ease-in-out infinite;
}
.hub-paw-btn .paw-badge-svg { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 12px 10px rgba(0,0,0,.32)); }
.hub-paw-btn__caption {
  position: absolute; left: 50%; bottom: -32px; transform: translateX(-50%);
  padding: 4px 20px; border-radius: 22px; background: #FFCA28; border: 5px solid var(--ink);
  font-size: 24px; font-weight: 900; white-space: nowrap; box-shadow: 0 5px 0 #F57F17;
}
.hub-paw-btn__pulse { position: absolute; inset: 0; border-radius: 50%; border: 8px solid #FFEB3B; animation: ring 1.8s ease-out infinite; }
.hub-paw-btn__pulse--delay { animation-delay: .9s; }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
.hub-album-btn {
  position: absolute; left: 1086px; top: 736px; width: 176px; height: 168px; border-radius: 40px;
  background: linear-gradient(180deg, #CE93D8, #8E24AA); border: 7px solid var(--ink);
  box-shadow: 0 10px 0 #4A148C, inset 0 5px 0 rgba(255,255,255,.5);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.hub-album-btn .album-icon { width: 104px; height: 104px; }
.hub-album-btn__count {
  position: absolute; right: -14px; top: -16px; min-width: 68px; height: 52px; padding: 0 10px;
  border-radius: 26px; background: #FFC107; border: 5px solid var(--ink);
  font-size: 26px; font-weight: 900; display: grid; place-items: center;
}
.hub-album-btn.is-highlighted { animation: hop 0.6s ease-in-out infinite; box-shadow: 0 0 0 10px #FFEB3B, 0 10px 0 #4A148C; }

/* ---------- SELECTION ---------- */
.sel-bg { inset: 0; background: linear-gradient(#81D4FA, #E1F5FE); }
.sel-top { left: 283px; top: 120px; width: 800px; height: 400px; }
.sel-scene-frame { position: absolute; inset: 0; border-radius: 40px; overflow: hidden; border: 8px solid var(--ink); background: #fff; box-shadow: 0 10px 0 rgba(0,0,0,.2); }
.scene-svg { width: 100%; height: 100%; display: block; }
.sel-reach-zone { left: 0; right: 0; top: 560px; height: 340px; display: flex; justify-content: center; gap: 60px; align-items: flex-start; }
.pup-card {
  position: relative; width: 280px; height: 320px; border-radius: 40px; border: 12px solid var(--c);
  background: var(--cl); box-shadow: 0 10px 0 var(--cd); display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  transition: transform .5s cubic-bezier(.3,1.6,.5,1), opacity .4s; transition-delay: calc(var(--i) * 120ms);
}
.pup-card.is-locked { opacity: .35; transform: translateY(50px) scale(.9); }
.pup-card.is-ready { opacity: 1; transform: none; }
.pup-card__symbol { position: absolute; left: 10px; top: 8px; width: 62px; height: 62px; }
.card-symbol-svg { width: 100%; height: 100%; }
.pup-card__portrait { display: block; }
.card-pup-svg { width: 190px; height: 220px; display: block; }
.pup-card__name { height: 40px; font-size: 28px; font-weight: 900; line-height: 36px; }
.pup-card.is-wrong { animation: shake .5s; }
.pup-card.is-disabled { opacity: .4; }
.pup-card.is-hint { animation: card-hint .9s ease-in-out infinite; border-color: var(--gold); box-shadow: 0 0 0 10px rgba(255,215,64,.6), 0 0 50px 20px #FFD54F; }
.pup-card.is-correct { animation: card-win .7s ease-in-out infinite; z-index: 2; }
.pup-card.is-dim { opacity: .25; transform: scale(.9); }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-22px) rotate(-3deg); } 40% { transform: translateX(22px) rotate(3deg); } 60% { transform: translateX(-14px); } 80% { transform: translateX(14px); } }
@keyframes card-hint { 50% { transform: translateY(-30px) scale(1.06); } }
@keyframes card-win { 50% { transform: translateY(-20px) scale(1.12); } }

/* ---------- ACTION ---------- */
.action-bg { inset: 0; background: radial-gradient(circle at 50% 30%, var(--pup-color), var(--pup-dark)); }
.action-container, .action-placeholder { position: absolute; inset: 0; }
.action-top { position: absolute; left: 233px; top: 120px; width: 900px; height: 420px; }
.action-scene-frame { position: absolute; inset: 0; border-radius: 44px; overflow: hidden; border: 8px solid #fff; background: #fff; box-shadow: 0 10px 0 rgba(0,0,0,.25); }
.action-scene-layer { position: absolute; inset: 0; opacity: 0; transition: opacity .5s; }
.action-scene-layer.is-active { opacity: 1; }
.action-scene-frame.is-solved { animation: solved-pop .8s cubic-bezier(.3,1.6,.5,1); }
@keyframes solved-pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
.action-reach-zone { position: absolute; inset: 0; }
.action-pup-helper { position: absolute; left: 50px; top: 690px; width: 180px; height: 209px; animation: hop .8s ease-in-out infinite; }
.action-pup-svg { width: 100%; height: 100%; }
.action-pup-helper.is-celebrating { animation-duration: .35s; }
.action-big-btn {
  position: absolute; left: 343px; top: 610px; width: 680px; height: 190px; border-radius: 95px;
  background: #FFEB3B; border: 10px solid var(--ink); box-shadow: 0 14px 0 #F9A825;
  display: flex; align-items: center; justify-content: center; gap: 24px; animation: big-bounce 1s ease-in-out infinite;
}
.action-big-btn__label { font-size: 66px; font-weight: 900; }
.action-big-btn__symbol { width: 100px; height: 100px; }
.action-btn-symbol-svg { width: 100%; height: 100%; }
.action-big-btn__paw { position: absolute; right: 24px; top: -44px; width: 80px; height: 80px; background: #1E88E5; border: 6px solid var(--ink); border-radius: 50%; padding: 14px; }
.action-big-btn__ring { position: absolute; inset: -10px; border-radius: 105px; border: 8px solid rgba(255,255,255,.8); animation: ring-soft 1.4s ease-out infinite; }
.action-big-btn.is-hinting { box-shadow: 0 0 0 12px rgba(255,255,255,.7), 0 14px 0 #F9A825; }
.action-big-btn.is-activated { animation: none; transform: scale(.9); opacity: .6; }
@keyframes big-bounce { 50% { transform: translateY(-18px); } }
@keyframes ring-soft { from { transform: scale(1); opacity: 1; } to { transform: scale(1.12, 1.3); opacity: 0; } }

/* ---------- REWARD ---------- */
.reward-bg { inset: 0; background: radial-gradient(circle at 50% 45%, #FFF59D, var(--pup-color) 80%); }
.reward-pup { left: 433px; top: 200px; width: 500px; height: 580px; animation: reward-jump .7s ease-in-out infinite; }
.reward-pup-svg { width: 100%; height: 100%; }
@keyframes reward-jump { 50% { transform: translateY(-60px) rotate(3deg); } }
.confetti-canvas { position: absolute; left: 0; top: 0; width: 1366px; height: 1024px; pointer-events: none; z-index: 5; }
.sticker-overlay { inset: 0; z-index: 20; background: rgba(20,10,40,.75); display: grid; place-items: center; }
.sticker-rays { position: absolute; width: 1300px; height: 1300px; left: 33px; top: -138px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,235,59,.55) 0 10deg, transparent 10deg 20deg); animation: spin 14s linear infinite; }
.sticker-card { position: relative; width: 520px; height: 680px; border-radius: 60px; border: 16px solid var(--c); background: #fff; box-shadow: 0 0 0 10px #FFD54F, 0 0 70px 20px #FFEB3B; animation: sticker-in .8s cubic-bezier(.3,1.6,.5,1), pulse 1.4s .8s ease-in-out infinite; }
.sticker-banner { position: absolute; left: -40px; right: -40px; top: -50px; padding: 12px 0; background: #E53935; border: 8px solid var(--ink); border-radius: 40px; color: #fff; font-size: 64px; font-weight: 900; text-align: center; }
.sticker-portrait { position: absolute; left: 60px; top: 90px; width: 380px; height: 440px; }
.sticker-pup-svg { width: 100%; height: 100%; }
.sticker-symbol { position: absolute; left: 50%; bottom: 20px; width: 100px; height: 100px; margin-left: -50px; }
.sticker-symbol-svg { width: 100%; height: 100%; }
@keyframes sticker-in { from { transform: scale(0) rotate(-30deg); } }

/* ---------- 4. fázis: Interaktív Drag-and-Drop Matricaalbum (8 kutyus, szigorú hely-ellenőrzés) ---------- */
.album-backdrop { position: absolute; inset: 0; z-index: 40; background: rgba(20, 12, 42, 0.84); backdrop-filter: blur(6px); }
.album-stage { position: absolute; inset: 0; }
.album-banner {
  position: absolute; left: 423px; top: 20px; width: 520px; height: 76px;
  border-radius: 38px; background: linear-gradient(180deg, #AB47BC, #7B1FA2); border: 7px solid var(--ink);
  box-shadow: 0 6px 0 #4A148C; display: grid; place-items: center;
}
.album-banner__title { color: #fff; font-size: 40px; font-weight: 900; text-shadow: 0 3px 0 var(--ink); }

.album-board {
  position: absolute; left: 110px; top: 114px; width: 1146px; height: 520px;
  border-radius: 40px; border: 10px solid var(--ink); overflow: hidden;
  background: #E1F5FE; box-shadow: 0 12px 0 rgba(0,0,0,0.32);
}
.album-board__bg { width: 100%; height: 100%; display: block; }
.album-board__tower { position: absolute; left: 458px; top: 55px; width: 230px; height: 350px; pointer-events: none; }

.album-spots-layer, .album-tray-layer, .album-stickers-layer {
  position: absolute; inset: 0; pointer-events: none;
}

.album-home-spot {
  position: absolute; width: 132px; height: 132px; border-radius: 50%;
  border: 6px dashed var(--pup-color); background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 6px 14px rgba(0,0,0,0.18);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s;
}
.album-home-spot.is-occupied { opacity: 0.14; transform: scale(0.88); }
.album-home-spot.is-target-hint {
  animation: pulse 0.8s ease-in-out infinite;
  border-style: solid; border-width: 8px; border-color: #FFD54F;
  background: rgba(255, 245, 157, 0.92);
  box-shadow: 0 0 0 12px rgba(255, 213, 79, 0.55), 0 0 40px 14px #FFEB3B;
  z-index: 6;
}
.album-spot-symbol { width: 64px; height: 64px; opacity: 0.92; }
.album-home-spot__name {
  font-size: 17px; font-weight: 900; color: var(--ink);
  background: rgba(255,255,255,0.88); padding: 1px 8px; border-radius: 10px; margin-top: 2px;
}

.album-tray-bar {
  position: absolute; left: 48px; top: 690px; width: 1110px; height: 285px;
  border-radius: 42px; background: linear-gradient(180deg, #F3E5F5, #E1BEE7); border: 9px solid #8E24AA;
  box-shadow: 0 12px 0 #4A148C;
}

.album-tray-slot {
  position: absolute; width: 126px; height: 152px; border-radius: 26px;
  border: 6px solid var(--pup-color); background: var(--pup-light);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  pointer-events: auto;
}
.album-tray-pup-svg { width: 98px; height: 114px; display: block; }
.album-tray-slot__name { font-size: 18px; font-weight: 900; height: 26px; line-height: 24px; }
.album-tray-slot__check {
  display: none; position: absolute; right: -10px; top: -10px; width: 40px; height: 40px;
  border-radius: 50%; background: var(--gold); border: 4px solid var(--ink);
  font-size: 22px; font-weight: 900; place-items: center;
}
.album-tray-slot.is-locked { border-color: #B0BEC5; background: #ECEFF1; }
.album-tray-slot.is-locked .album-tray-slot__sil { filter: brightness(0); opacity: 0.22; }
.album-tray-slot.is-unlocked:not(.is-placed) .album-tray-slot__sil { opacity: 0.18; }
.album-tray-slot.is-placed .album-tray-slot__check { display: grid; }

.album-sticker {
  position: absolute; pointer-events: auto; z-index: 5;
  filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.32));
}
.album-sticker__card {
  width: 100%; height: 100%; border-radius: 26px;
  border: 6px solid #FFFFFF; outline: 4px solid var(--pup-color);
